<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pax Mantle — privacidade local para conversas com IA">
  <rect width="1200" height="630" fill="#F8F6E8"/>
  <!-- grid lines -->
  <line x1="400" y1="0" x2="400" y2="630" stroke="#463C2E" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#463C2E" stroke-opacity="0.15" stroke-width="1"/>

  <!-- prompt card (left): message with sensitive tokens -->
  <g>
    <rect x="80" y="180" width="280" height="270" fill="#E4DECC" stroke="#463C2E" stroke-width="1"/>
    <text x="100" y="220" font-family="monospace" font-size="15" letter-spacing="1" fill="#463C2E">SEU PROMPT</text>
    <rect x="100" y="245" width="180" height="14" fill="#463C2E" fill-opacity="0.25"/>
    <rect x="100" y="271" width="110" height="14" fill="#F45141"/>
    <rect x="218" y="271" width="90" height="14" fill="#463C2E" fill-opacity="0.25"/>
    <rect x="100" y="297" width="220" height="14" fill="#463C2E" fill-opacity="0.25"/>
    <rect x="100" y="323" width="80" height="14" fill="#463C2E" fill-opacity="0.25"/>
    <rect x="188" y="323" width="120" height="14" fill="#F45141"/>
    <rect x="100" y="349" width="200" height="14" fill="#463C2E" fill-opacity="0.25"/>
    <rect x="100" y="375" width="140" height="14" fill="#F45141"/>
    <text x="100" y="425" font-family="monospace" font-size="13" fill="#F45141">■ DADO PESSOAL</text>
  </g>

  <!-- arrow in -->
  <g stroke="#463C2E" stroke-width="2" fill="none">
    <line x1="360" y1="315" x2="455" y2="315"/>
    <path d="M447 308 L459 315 L447 322" fill="#463C2E" stroke="none"/>
  </g>

  <!-- the mantle (center): dark block that swaps tokens -->
  <g>
    <rect x="465" y="140" width="270" height="350" fill="#463C2E"/>
    <text x="600" y="190" font-family="monospace" font-size="16" letter-spacing="2" fill="#F8F6E8" text-anchor="middle">PAX MANTLE</text>
    <line x1="490" y1="210" x2="710" y2="210" stroke="#F8F6E8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="600" y="245" font-family="monospace" font-size="13" fill="#C3BE92" text-anchor="middle">DETECTA</text>
    <rect x="530" y="262" width="140" height="10" fill="#F45141"/>
    <text x="600" y="308" font-family="monospace" font-size="13" fill="#C3BE92" text-anchor="middle">DECIDE</text>
    <rect x="530" y="325" width="66" height="10" fill="#DFCB5A"/>
    <rect x="604" y="325" width="66" height="10" fill="#F45141"/>
    <text x="600" y="371" font-family="monospace" font-size="13" fill="#C3BE92" text-anchor="middle">SUBSTITUI</text>
    <rect x="530" y="388" width="140" height="10" fill="#417CE5"/>
    <text x="600" y="440" font-family="monospace" font-size="12" fill="#F8F6E8" fill-opacity="0.65" text-anchor="middle">100% NO SEU</text>
    <text x="600" y="460" font-family="monospace" font-size="12" fill="#F8F6E8" fill-opacity="0.65" text-anchor="middle">COMPUTADOR</text>
  </g>

  <!-- arrow out -->
  <g stroke="#463C2E" stroke-width="2" fill="none">
    <line x1="735" y1="315" x2="830" y2="315"/>
    <path d="M822 308 L834 315 L822 322" fill="#463C2E" stroke="none"/>
  </g>

  <!-- cloud card (right): scrubbed prompt -->
  <g>
    <rect x="840" y="180" width="280" height="270" fill="#E4DECC" stroke="#463C2E" stroke-width="1"/>
    <text x="860" y="220" font-family="monospace" font-size="15" letter-spacing="1" fill="#463C2E">O QUE A NUVEM VÊ</text>
    <rect x="860" y="245" width="180" height="14" fill="#463C2E" fill-opacity="0.25"/>
    <rect x="860" y="271" width="110" height="14" fill="#417CE5"/>
    <rect x="978" y="271" width="90" height="14" fill="#463C2E" fill-opacity="0.25"/>
    <rect x="860" y="297" width="220" height="14" fill="#463C2E" fill-opacity="0.25"/>
    <rect x="860" y="323" width="80" height="14" fill="#463C2E" fill-opacity="0.25"/>
    <rect x="948" y="323" width="120" height="14" fill="#417CE5"/>
    <rect x="860" y="349" width="200" height="14" fill="#463C2E" fill-opacity="0.25"/>
    <rect x="860" y="375" width="140" height="14" fill="#417CE5"/>
    <text x="860" y="425" font-family="monospace" font-size="13" fill="#417CE5">■ SUBSTITUTO REALISTA</text>
  </g>

  <!-- caption -->
  <text x="80" y="100" font-family="Gabarito, sans-serif" font-size="44" font-weight="700" fill="#463C2E">Pax Mantle</text>
  <text x="80" y="132" font-family="monospace" font-size="15" letter-spacing="1" fill="#463C2E" fill-opacity="0.6">IA COM PRIVACIDADE · SEUS DADOS NUNCA SAEM DA SUA MÁQUINA</text>
</svg>
