<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" fill="none">
  <!-- Central diamond/star with consistent horizontal lines -->

  <!-- Top pyramid section -->
  <line x1="280" y1="40" x2="280" y2="60" stroke="#463C2E" stroke-width="14" stroke-linecap="round"/>

  <!-- Upper middle section -->
  <line x1="260" y1="80" x2="300" y2="80" stroke="#463C2E" stroke-width="14" stroke-linecap="round"/>

  <line x1="240" y1="110" x2="320" y2="110" stroke="#463C2E" stroke-width="14" stroke-linecap="round"/>
  <line x1="240" y1="125" x2="320" y2="125" stroke="#463C2E" stroke-width="14" stroke-linecap="round"/>

  <line x1="220" y1="150" x2="340" y2="150" stroke="#463C2E" stroke-width="14" stroke-linecap="round"/>
  <line x1="220" y1="165" x2="340" y2="165" stroke="#463C2E" stroke-width="14" stroke-linecap="round"/>

  <!-- Left wing -->
  <line x1="80" y1="200" x2="220" y2="200" stroke="#463C2E" stroke-width="14" stroke-linecap="round"/>

  <!-- Center horizontal line -->
  <line x1="40" y1="235" x2="520" y2="235" stroke="#463C2E" stroke-width="14" stroke-linecap="round"/>

  <!-- Right wing -->
  <line x1="340" y1="270" x2="480" y2="270" stroke="#463C2E" stroke-width="14" stroke-linecap="round"/>

  <!-- Lower middle section -->
  <line x1="220" y1="305" x2="340" y2="305" stroke="#463C2E" stroke-width="14" stroke-linecap="round"/>
  <line x1="220" y1="320" x2="340" y2="320" stroke="#463C2E" stroke-width="14" stroke-linecap="round"/>

  <line x1="240" y1="345" x2="320" y2="345" stroke="#463C2E" stroke-width="14" stroke-linecap="round"/>
  <line x1="240" y1="360" x2="320" y2="360" stroke="#463C2E" stroke-width="14" stroke-linecap="round"/>

  <!-- Bottom section -->
  <line x1="260" y1="390" x2="300" y2="390" stroke="#463C2E" stroke-width="14" stroke-linecap="round"/>

  <line x1="280" y1="410" x2="280" y2="430" stroke="#463C2E" stroke-width="14" stroke-linecap="round"/>

  <!-- Accent stars (4-pointed) -->
  <!-- Top right star -->
  <g transform="translate(420, 150)">
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#463C2E" stroke-width="10" stroke-linecap="round"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#463C2E" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Left star -->
  <g transform="translate(140, 250)">
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#463C2E" stroke-width="10" stroke-linecap="round"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#463C2E" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Bottom right star -->
  <g transform="translate(400, 340)">
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#463C2E" stroke-width="10" stroke-linecap="round"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#463C2E" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Bottom left star -->
  <g transform="translate(160, 380)">
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#463C2E" stroke-width="10" stroke-linecap="round"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#463C2E" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>