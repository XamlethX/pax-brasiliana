<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <rect width="800" height="800" fill="#463C2E"/>
  <!-- Cap silhouette -->
  <path d="M220 420 C220 340 290 280 400 280 C510 280 580 340 580 420 L580 460 L220 460 Z" fill="#F8F6E8" fill-opacity="0.08" stroke="#F8F6E8" stroke-width="1.5" stroke-opacity="0.2"/>
  <!-- Brim -->
  <path d="M200 460 L600 460 L620 480 L180 480 Z" fill="#F8F6E8" fill-opacity="0.06" stroke="#F8F6E8" stroke-width="1.5" stroke-opacity="0.2"/>
  <!-- Button on top -->
  <circle cx="400" cy="285" r="10" fill="#F8F6E8" fill-opacity="0.15" stroke="#F8F6E8" stroke-width="1.5" stroke-opacity="0.2"/>
  <!-- Crown seam -->
  <path d="M400 290 L400 460" stroke="#F8F6E8" stroke-width="0.75" stroke-opacity="0.15" stroke-dasharray="4 4"/>
  <!-- PAX text on front panel -->
  <text x="400" y="440" font-family="'Barlow', sans-serif" font-weight="900" font-size="36" letter-spacing="-1" fill="#F8F6E8" fill-opacity="0.7" text-anchor="middle">PAX</text>
</svg>
